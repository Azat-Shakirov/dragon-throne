<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon's Throne</title>
    <style>
      /* v2.10.1: theme font. IM Fell English — an old printing-press serif
         that matches the painterly castle aesthetic. Self-hosted from
         public/fonts/ (served at /fonts/) so the game has no runtime
         dependency on Google Fonts. `swap` shows the serif fallback until
         the woff2 loads. Applied game-wide via the body font below; the
         shared THEME_FONT constant in menuStyles.ts mirrors this stack for
         the inline-styled components. */
      @font-face {
        font-family: 'IM Fell English';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/im-fell-english-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IM Fell English';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/im-fell-english-italic.woff2') format('woff2');
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      body {
        font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
        color: #eee;
      }
      /* v2.11.1: hide scrollbars on panes that may overflow (e.g. the
         Battle Royale map grid / setup pane) while keeping them scrollable.
         Avoids the chunky default scrollbar clashing with the castle UI. */
      .dt-noscroll {
        scrollbar-width: none;       /* Firefox */
        -ms-overflow-style: none;    /* old Edge/IE */
      }
      .dt-noscroll::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;               /* Chromium/WebKit */
      }
      /* v2.11.2: in-game canvas host. dvh keeps the map inside the visible
         viewport on mobile (100vh sits behind the browser chrome, cropping
         the map top/bottom). The 100vh line is the fallback for engines
         without dvh; the 100dvh line overrides where supported. */
      .game-host {
        width: 100vw;
        height: calc(100vh - 24px);
        height: calc(100dvh - 24px);
        margin-top: 24px;
        position: relative;
        cursor: crosshair;
      }
      /* v2.10.0: hover/active feedback for the wood-plaque menu buttons
         (.dt-btn) and level tiles (.dt-level-btn). Lives here as CSS
         classes because the buttons use inline styles, and :hover can't
         be expressed inline. Only `filter`/`transform` are touched —
         neither is set inline, so there's no specificity clash with the
         inline border-image/background. :not(:disabled) keeps locked
         levels and disabled buttons inert. */
      .dt-btn {
        transition: filter 120ms ease, transform 120ms ease;
      }
      .dt-btn:hover:not(:disabled) {
        filter: brightness(1.13) drop-shadow(0 0 7px rgba(245, 200, 120, 0.55));
        transform: translateY(-1px);
      }
      .dt-btn:active:not(:disabled) {
        transform: translateY(0);
        filter: brightness(1.06);
      }
      .dt-level-btn {
        transition: filter 120ms ease, transform 120ms ease;
      }
      .dt-level-btn:hover:not(:disabled) {
        filter: brightness(1.13) drop-shadow(0 0 9px rgba(245, 200, 120, 0.6));
        transform: scale(1.06);
        z-index: 1;
      }
      .dt-level-btn:active:not(:disabled) {
        transform: scale(1);
      }
      /* v2.10.1: hover for the LevelSelect unit-type (archetype) chips.
         The selected chip's azure glow lives in .dt-chip-selected (moved
         out of an inline filter) so the hover brightness can layer on top
         of it via the combined :hover rule below. */
      .dt-chip {
        transition: filter 120ms ease, transform 120ms ease;
      }
      .dt-chip:hover:not(:disabled) {
        filter: brightness(1.15) drop-shadow(0 0 6px rgba(245, 200, 120, 0.5));
        transform: translateY(-1px);
      }
      .dt-chip:active:not(:disabled) {
        transform: translateY(0);
        filter: brightness(1.06);
      }
      .dt-chip-selected {
        filter: drop-shadow(0 0 6px rgba(61, 169, 252, 0.85));
      }
      .dt-chip-selected:hover:not(:disabled) {
        filter: drop-shadow(0 0 6px rgba(61, 169, 252, 0.85)) brightness(1.15);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
