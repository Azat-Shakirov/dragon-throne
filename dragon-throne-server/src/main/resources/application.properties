# Dragon's Throne backend — Spring Boot configuration.

# REST API + H2 console served here.
server.port=8080

# H2 in-memory database. DB_CLOSE_DELAY=-1 keeps the schema alive for the
# whole JVM lifetime (data is still lost on restart — this is a demo).
spring.datasource.url=jdbc:h2:mem:dragonthrone;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the tables from the @Entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, user sa).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
